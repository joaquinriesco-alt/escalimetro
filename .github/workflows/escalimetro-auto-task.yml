# M02 — ejecutor GitHub-native de TASKs de ESCALÍMETRO.
#
# Un issue con el contrato ESCALIMETRO_AUTO_TASK_V1 dispara la ejecución de UNA TASK ya aprobada.
# No decide nada: transporta un ID verificado hasta Claude y publica lo que Claude hizo, después
# de revisarlo. Guía completa: docs/ai-development/AUTO_TASK_EXECUTOR.md
#
# ESTADO: construido, NO activado. GitHub sólo dispara `issues` desde la rama por defecto (`main`),
# y este archivo no está en `main`. Activarlo es una decisión de Joaquín (DR-9).
#
# Cuatro jobs, cada uno con lo mínimo:
#   gate     sin secretos. Actor, contrato, repo e issues duplicados, por scripts/auto_task.py.
#   claude   Claude trabaja en una rama hija de la TASK. Token de GitHub de SÓLO LECTURA: aunque
#            lea el token, no puede empujar nada. Sus commits salen como un git bundle.
#   publish  sin credenciales de Anthropic. Verifica el bundle (nada en .github/, src/, tasks/,
#            .claude/ ni el ejecutor; sin secretos; desciende de la TASK) y recién entonces crea
#            la rama. Nunca fuerza, nunca mergea. Si la corrida se cancela, no publica.
#   notify   sólo puede comentar en el issue: qué pasó y dónde quedó.
#
# Versiones fijadas por SHA completo (verificadas el 2026-09-30 contra el repo de cada action):
#   actions/checkout          v7.0.1    3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-python      v7.0.0    5fda3b95a4ea91299a34e894583c3862153e4b97
#   actions/upload-artifact   v7.0.1    043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact v8.0.1    3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   anthropics/claude-code-action v1.0.238 12dd8d74c712f5f3669365b2369b558c495b1104
# Ojo: el SHA fija la action, no el CLI de Claude Code que ella descarga al correr.

name: escalimetro-auto-task

on:
  issues:
    types: [opened]

# Nada por defecto. Cada job pide sólo lo que usa.
permissions: {}

concurrency:
  # el número de issue es un entero del evento, no texto del usuario
  group: escalimetro-auto-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    # Compuerta 1, ANTES de que exista un runner: si esto es falso, no hay checkout, ni pasos,
    # ni secretos. Repite varios campos a propósito: el usuario, su id, el autor y el emisor.
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.repository == 'joaquinriesco-alt/escalimetro' &&
      github.actor == 'joaquinriesco-alt' &&
      github.actor_id == '238602327' &&
      github.event.sender.login == 'joaquinriesco-alt' &&
      github.event.issue.user.login == 'joaquinriesco-alt' &&
      github.event.issue.user.type == 'User' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[ESCALIMETRO_AUTO_TASK] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read          # para detectar otro issue de la misma TASK
    outputs:
      ok: ${{ steps.preflight.outputs.ok }}
      task_id: ${{ steps.preflight.outputs.task_id }}
      task_branch: ${{ steps.preflight.outputs.task_branch }}
      task_commit: ${{ steps.preflight.outputs.task_commit }}
      base_branch: ${{ steps.preflight.outputs.base_branch }}
      impl_branch: ${{ steps.preflight.outputs.impl_branch }}
      prompt: ${{ steps.preflight.outputs.prompt }}
    steps:
      # El preflight que corre es el de la rama por defecto, no el de la rama de la TASK: la TASK
      # no puede reescribir a quien la juzga.
      - name: Checkout del ejecutor (rama por defecto)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # el preflight compara ancestros: hace falta la historia
          persist-credentials: false
      # Compuerta 2: el issue se lee del archivo del evento, como datos. Nunca se interpola en
      # un comando. Falla cerrado.
      - name: Preflight del contrato ESCALIMETRO_AUTO_TASK_V1
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/auto_task.py preflight --repo .

  claude:
    needs: gate
    # Sin always(): si gate se saltó o falló, esto también.
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.actor == 'joaquinriesco-alt' &&
      github.event.issue.user.login == 'joaquinriesco-alt'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # Los procesos que Claude lance no HEREDAN la credencial de Anthropic. Es parcial: sin
      # aislamiento de procesos, código del mismo usuario puede leerla de /proc. Ver la guía §8.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      TASK_COMMIT: ${{ needs.gate.outputs.task_commit }}
      IMPL_BRANCH: ${{ needs.gate.outputs.impl_branch }}
    steps:
      - name: Checkout del commit exacto de la TASK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.task_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Rama de implementación, hija de la TASK
        run: |
          test "$(git rev-parse HEAD)" = "$TASK_COMMIT"
          git switch -c "$IMPL_BRANCH"
          git config user.name "escalimetro-auto-task"
          git config user.email "escalimetro-auto-task@users.noreply.github.com"
      - name: Python del proyecto
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Entorno de tests (.venv, como en CLAUDE.md)
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt pytest
      - name: Credencial de Claude presente (sólo sí/no)
        env:
          PRESENTE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$PRESENTE" = "true" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN: PRESENTE"; else
            echo "CLAUDE_CODE_OAUTH_TOKEN: AUSENTE"; exit 1; fi
      - name: Claude ejecuta la TASK
        id: claude
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          # Suscripción, no API: nunca se pasa anthropic_api_key (tendría precedencia y cobraría).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # El token del job (sólo lectura). Sin GitHub App, sin OIDC.
          github_token: ${{ github.token }}
          # Armado por el preflight con valores validados. No contiene la TASK ni el issue.
          prompt: ${{ needs.gate.outputs.prompt }}
          base_branch: ${{ needs.gate.outputs.task_branch }}
          classify_inline_comments: "false"
          claude_args: >-
            --max-turns 400
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,LS,TodoWrite,Bash(.venv/bin/python:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(ls:*)"
            --disallowedTools "Bash(git push:*),WebFetch,WebSearch"
      # !cancelled(): una cancelación es una persona deteniendo la corrida; no se empaqueta nada
      - name: Empaquetar los commits de Claude
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        run: |
          if [ "$(git rev-list --count "$TASK_COMMIT"..HEAD)" -gt 0 ]; then
            git bundle create "$RUNNER_TEMP/impl.bundle" "$TASK_COMMIT"..HEAD
          fi
      - name: Entregar el bundle al job que publica
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impl-bundle
          path: ${{ runner.temp }}/impl.bundle
          if-no-files-found: ignore
          retention-days: 1     # lo rechazado no queda descargable más de un día

  publish:
    needs: [gate, claude]
    # Publica aunque Claude haya fallado, para poder auditar lo hecho. Nunca si gate no pasó, y
    # nunca si alguien canceló la corrida.
    if: >-
      ${{ !cancelled() &&
      needs.claude.result != 'cancelled' &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.ok == 'true' &&
      github.actor == 'joaquinriesco-alt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      verdict: ${{ steps.verify.outputs.verdict }}
      report: ${{ steps.verify.outputs.report }}
      pushed: ${{ steps.push.outcome }}
    env:
      TASK_ID: ${{ needs.gate.outputs.task_id }}
      TASK_COMMIT: ${{ needs.gate.outputs.task_commit }}
      IMPL_BRANCH: ${{ needs.gate.outputs.impl_branch }}
    steps:
      - name: Checkout del ejecutor (rama por defecto)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recibir el bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: impl-bundle
          path: ${{ runner.temp }}/bundle
      - name: Verificar lo que hizo Claude
        id: verify
        run: |
          python3 scripts/auto_task.py verify --repo . \
            --bundle "$RUNNER_TEMP/bundle/impl.bundle" \
            --task-commit "$TASK_COMMIT" --task-id "$TASK_ID" --impl-branch "$IMPL_BRANCH"
      - name: Crear la rama de implementación (nunca forzada)
        id: push
        if: steps.verify.outputs.verdict == 'PUBLISH' || steps.verify.outputs.verdict == 'PUBLISH_INCOMPLETE'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.verify.outputs.head }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "$HEAD_SHA:refs/heads/$IMPL_BRANCH"

  notify:
    needs: [gate, claude, publish]
    # Avisa siempre que el issue pasó la compuerta, también si se canceló. Sólo puede comentar.
    if: >-
      ${{ always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.ok == 'true' &&
      github.actor == 'joaquinriesco-alt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      TASK_ID: ${{ needs.gate.outputs.task_id }}
      IMPL_BRANCH: ${{ needs.gate.outputs.impl_branch }}
      ISSUE: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLAUDE_RESULT: ${{ needs.claude.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      VERDICT: ${{ needs.publish.outputs.verdict }}
      REPORT_OK: ${{ needs.publish.outputs.report }}
      PUSHED: ${{ needs.publish.outputs.pushed }}
    steps:
      - name: Informar en el issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**${TASK_ID}** · ejecución automática · Claude: \`${CLAUDE_RESULT}\` · verificación: \`${VERDICT:-SIN_VEREDICTO}\` · publicación: \`${PUBLISH_RESULT}\`"
            echo
            if [ "$PUSHED" = "success" ]; then
              echo "Rama: https://github.com/${REPO}/tree/${IMPL_BRANCH} · REPORT: ${REPORT_OK}"
            elif [ "$VERDICT" = "PUBLISH" ] || [ "$VERDICT" = "PUBLISH_INCOMPLETE" ]; then
              echo "Rama: NO PUBLICADA (push: \`${PUSHED:-sin correr}\`)"
            fi
            echo "Run: ${RUN_URL}"
            echo
            echo "Sin merge, sin deploy. Audita ChatGPT; decide Joaquín."
          } > "$RUNNER_TEMP/comentario.md"
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/comentario.md"
