# M02 — ejecutor GitHub-native de TASKs de ESCALÍMETRO.
#
# Un issue con el contrato ESCALIMETRO_AUTO_TASK_V1 dispara la ejecución de UNA TASK ya aprobada.
# No decide nada: transporta un ID verificado hasta Claude y publica lo que Claude hizo, después
# de revisarlo. Guía completa: docs/ai-development/AUTO_TASK_EXECUTOR.md
#
# ESTADO: GitHub sólo dispara `issues` con la copia de la rama por defecto (`main`). Quedó activo
# el 2026-10-01, cuando `main` avanzó a M02 con la autorización de Joaquín. La primera corrida
# real (M03) murió al instalar Claude Code por falta de bubblewrap. M02.1 lo repara y rige recién
# cuando llegue a `main`.
#
# Cuatro jobs, cada uno con lo mínimo:
#   gate     sin secretos. Actor, contrato, repo e issues duplicados, por scripts/auto_task.py.
#   claude   Claude trabaja en una rama hija de la TASK. Token de GitHub de SÓLO LECTURA: aunque
#            lea el token, no puede empujar nada. Sus commits salen como un git bundle. Antes de
#            la credencial, bubblewrap instalado y probado; si el sandbox no opera, no hay Claude.
#   publish  sin credenciales de Anthropic. Verifica el bundle (nada en .github/, src/, tasks/,
#            .claude/ ni el ejecutor; sin secretos; desciende de la TASK) y recién entonces crea
#            la rama. Nunca fuerza, nunca mergea. Si la corrida se cancela, no publica.
#   notify   sólo puede comentar en el issue: qué pasó y dónde quedó.
#
# Versiones fijadas por SHA completo (verificadas el 2026-09-30 contra el repo de cada action):
#   actions/checkout          v7.0.1    3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-python      v7.0.0    5fda3b95a4ea91299a34e894583c3862153e4b97
#   actions/upload-artifact   v7.0.1    043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact v8.0.1    3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   anthropics/claude-code-action v1.0.238 12dd8d74c712f5f3669365b2369b558c495b1104
# Ojo: el SHA fija la action y la versión del CLI que pide (2.1.286), no el instalador, que se
# baja de claude.ai al correr y sin hash.

name: escalimetro-auto-task

on:
  issues:
    types: [opened]

# Nada por defecto. Cada job pide sólo lo que usa.
permissions: {}

concurrency:
  # el número de issue es un entero del evento, no texto del usuario
  group: escalimetro-auto-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    # Compuerta 1, ANTES de que exista un runner: si esto es falso, no hay checkout, ni pasos,
    # ni secretos. Repite varios campos a propósito: el usuario, su id, el autor y el emisor.
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.repository == 'joaquinriesco-alt/escalimetro' &&
      github.actor == 'joaquinriesco-alt' &&
      github.actor_id == '238602327' &&
      github.event.sender.login == 'joaquinriesco-alt' &&
      github.event.issue.user.login == 'joaquinriesco-alt' &&
      github.event.issue.user.type == 'User' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[ESCALIMETRO_AUTO_TASK] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read          # para detectar otro issue de la misma TASK
    outputs:
      ok: ${{ steps.preflight.outputs.ok }}
      task_id: ${{ steps.preflight.outputs.task_id }}
      task_branch: ${{ steps.preflight.outputs.task_branch }}
      task_commit: ${{ steps.preflight.outputs.task_commit }}
      base_branch: ${{ steps.preflight.outputs.base_branch }}
      impl_branch: ${{ steps.preflight.outputs.impl_branch }}
      prompt: ${{ steps.preflight.outputs.prompt }}
    steps:
      # El preflight que corre es el de la rama por defecto, no el de la rama de la TASK: la TASK
      # no puede reescribir a quien la juzga.
      - name: Checkout del ejecutor (rama por defecto)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # el preflight compara ancestros: hace falta la historia
          persist-credentials: false
      # Compuerta 2: el issue se lee del archivo del evento, como datos. Nunca se interpola en
      # un comando. Falla cerrado.
      - name: Preflight del contrato ESCALIMETRO_AUTO_TASK_V1
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/auto_task.py preflight --repo .

  claude:
    needs: gate
    # Sin always(): si gate se saltó o falló, esto también.
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.actor == 'joaquinriesco-alt' &&
      github.event.issue.user.login == 'joaquinriesco-alt'
    # Fijo, no ubuntu-latest: desde el 2026-10-19 esa etiqueta pasa a 26.04, que carga un perfil de
    # AppArmor que deja sin capacidades a los hijos de bwrap. El método de los pasos de aislamiento
    # es el que upstream usa en 24.04; estos pasos todavía no corrieron en un runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # Los procesos que Claude lance no HEREDAN la credencial de Anthropic y, con bubblewrap
      # (los dos primeros pasos), corren en su propio PID namespace: no ven el /proc del runner.
      # Lo que corre fuera del sandbox sigue pudiendo leerla. Ver la guía §8.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      TASK_COMMIT: ${{ needs.gate.outputs.task_commit }}
      IMPL_BRANCH: ${{ needs.gate.outputs.impl_branch }}
    steps:
      # M02.1. Con el scrub activo, Claude Code exige bubblewrap: sin él, su instalador aborta
      # (run 36864248192). La action fijada sólo lo prepara cuando hay allowed_non_write_users,
      # que acá no se usa; por eso se prepara a mano, con su mismo método. Va primero: antes de
      # cualquier código del repo, y sudo sólo en este paso.
      - name: Aislamiento de subprocesos (bubblewrap)
        shell: bash
        timeout-minutes: 15
        run: |
          # Cada intento con su tope: un apt colgado no puede comerse los reintentos. Decide la
          # instalación, no el update: un repositorio de terceros caído no impide bajar bubblewrap.
          for intento in 1 2 3; do
            sudo timeout 180 apt-get update -qq || echo "::warning::apt-get update terminó con errores"
            if sudo timeout 180 apt-get install -y --no-install-recommends bubblewrap socat; then
              break
            fi
            if [ "$intento" = 3 ]; then
              echo "::error::no se pudo instalar bubblewrap"
              exit 1
            fi
            sleep 5
          done
          # docker equivale a root —el usuario runner está en su grupo— y bubblewrap no bloquea sus
          # sockets: encendido, un comando del sandbox podría pedirle un contenedor que lea la
          # credencial. Apagado. Si no se pudiera, la prueba del paso siguiente lo detecta.
          sudo systemctl stop docker.socket docker.service || echo "::warning::docker no se detuvo"
          # Ubuntu 24.04 deja crear user namespaces sin privilegios pero, por AppArmor, sin
          # capacidades, y bwrap las necesita. La action y sandbox-runtime lo liberan igual.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" != 0 ]; then
              echo "::error::AppArmor sigue restringiendo los user namespaces"
              exit 1
            fi
          fi
      # Que el binario exista no basta: el sandbox tiene que poder operar, sin sudo, como lo usará
      # Claude. Si no, el job termina acá, antes de que la credencial llegue a ningún proceso.
      - name: Aislamiento verificado (antes de la credencial)
        shell: bash
        timeout-minutes: 2
        run: |
          fallar() { echo "::error::aislamiento no disponible: $1"; exit 1; }
          command -v bwrap >/dev/null || fallar "falta bwrap"
          command -v socat >/dev/null || fallar "falta socat"
          bwrap --version || fallar "bwrap no arranca"
          afuera=$(readlink /proc/self/ns/pid) || fallar "no se pudo leer el PID namespace del runner"
          # Como el sandbox de Claude Code en modo seguro (sandbox-runtime): user, PID y red propios,
          # sin capacidades y con /proc nuevo. Adentro se informa lo que se ve —cada falla tiene su
          # mensaje—: no_new_privs (sudo no escala desde el sandbox) y si docker todavía responde.
          adentro=$(bwrap --new-session --die-with-parent --unshare-user --unshare-pid --unshare-net \
              --cap-drop ALL --ro-bind / / --dev /dev --proc /proc \
              /bin/sh -c 'readlink /proc/self/ns/pid
                if [ -e "/proc/$1" ]; then echo VISIBLE; else echo AISLADO; fi
                if grep -q "^NoNewPrivs:[[:space:]]*1$" /proc/self/status; then echo SIN_PRIVILEGIOS
                else echo CON_PRIVILEGIOS; fi
                if socat -u OPEN:/dev/null UNIX-CONNECT:/run/docker.sock 2>/dev/null; then echo DOCKER
                else echo SIN_DOCKER; fi' \
              sh "$$") || fallar "bwrap no pudo crear el sandbox (user namespaces restringidos?)"
          linea() { printf '%s\n' "$adentro" | sed -n "$1p"; }
          [ "$(printf '%s\n' "$adentro" | wc -l)" -eq 4 ] || fallar "salida inesperada del sandbox"
          ns=$(linea 1)
          case "$ns" in pid:\[*\]) ;; *) fallar "el sandbox no informó su PID namespace" ;; esac
          [ "$(linea 2)" = AISLADO ] || fallar "el runner es visible desde el sandbox"
          [ "$ns" != "$afuera" ] || fallar "el sandbox comparte el PID namespace del runner"
          [ "$(linea 3)" = SIN_PRIVILEGIOS ] || fallar "el sandbox puede ganar privilegios (sin no_new_privs)"
          [ "$(linea 4)" = SIN_DOCKER ] || fallar "el sandbox llega al socket de docker"
          echo "AISLAMIENTO: OK · PID namespace propio $ns, distinto del runner $afuera"
      - name: Checkout del commit exacto de la TASK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.task_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Rama de implementación, hija de la TASK
        run: |
          test "$(git rev-parse HEAD)" = "$TASK_COMMIT"
          git switch -c "$IMPL_BRANCH"
          git config user.name "escalimetro-auto-task"
          git config user.email "escalimetro-auto-task@users.noreply.github.com"
      - name: Python del proyecto
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Entorno de tests (.venv, como en CLAUDE.md)
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt pytest
      - name: Credencial de Claude presente (sólo sí/no)
        env:
          PRESENTE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$PRESENTE" = "true" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN: PRESENTE"; else
            echo "CLAUDE_CODE_OAUTH_TOKEN: AUSENTE"; exit 1; fi
      - name: Claude ejecuta la TASK
        id: claude
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          # Suscripción, no API: nunca se pasa anthropic_api_key (tendría precedencia y cobraría).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # El token del job (sólo lectura). Sin GitHub App, sin OIDC.
          github_token: ${{ github.token }}
          # Armado por el preflight con valores validados. No contiene la TASK ni el issue.
          prompt: ${{ needs.gate.outputs.prompt }}
          base_branch: ${{ needs.gate.outputs.task_branch }}
          classify_inline_comments: "false"
          claude_args: >-
            --max-turns 400
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,LS,TodoWrite,Bash(.venv/bin/python:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(ls:*)"
            --disallowedTools "Bash(git push:*),WebFetch,WebSearch"
      # !cancelled(): una cancelación es una persona deteniendo la corrida; no se empaqueta nada
      - name: Empaquetar los commits de Claude
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        run: |
          if [ "$(git rev-list --count "$TASK_COMMIT"..HEAD)" -gt 0 ]; then
            git bundle create "$RUNNER_TEMP/impl.bundle" "$TASK_COMMIT"..HEAD
          fi
      - name: Entregar el bundle al job que publica
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impl-bundle
          path: ${{ runner.temp }}/impl.bundle
          if-no-files-found: ignore
          retention-days: 1     # lo rechazado no queda descargable más de un día

  publish:
    needs: [gate, claude]
    # Publica aunque Claude haya fallado, para poder auditar lo hecho. Nunca si gate no pasó, y
    # nunca si alguien canceló la corrida.
    if: >-
      ${{ !cancelled() &&
      needs.claude.result != 'cancelled' &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.ok == 'true' &&
      github.actor == 'joaquinriesco-alt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      verdict: ${{ steps.verify.outputs.verdict }}
      report: ${{ steps.verify.outputs.report }}
      commits: ${{ steps.verify.outputs.commits }}
      files: ${{ steps.count.outputs.files }}
      pushed: ${{ steps.push.outcome }}
    env:
      TASK_ID: ${{ needs.gate.outputs.task_id }}
      TASK_COMMIT: ${{ needs.gate.outputs.task_commit }}
      IMPL_BRANCH: ${{ needs.gate.outputs.impl_branch }}
    steps:
      - name: Checkout del ejecutor (rama por defecto)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recibir el bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: impl-bundle
          path: ${{ runner.temp }}/bundle
      - name: Verificar lo que hizo Claude
        id: verify
        run: |
          python3 scripts/auto_task.py verify --repo . \
            --bundle "$RUNNER_TEMP/bundle/impl.bundle" \
            --task-commit "$TASK_COMMIT" --task-id "$TASK_ID" --impl-branch "$IMPL_BRANCH"
      - name: Contar archivos verificados
        id: count
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/bundle/impl.bundle" ] && [ -n "${{ steps.verify.outputs.head }}" ]; then
            git fetch --quiet --no-tags "$RUNNER_TEMP/bundle/impl.bundle" "${{ steps.verify.outputs.head }}:refs/auto/status" || true
            N=$(git -c core.quotePath=false diff --name-only "$TASK_COMMIT"..refs/auto/status 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')
          else
            N=0
          fi
          echo "files=$N" >> "$GITHUB_OUTPUT"
      - name: Rechazar implementación sin output
        if: steps.verify.outputs.verdict == 'NOTHING'
        run: |
          echo "::error::NO_OUTPUT: la TASK llegó a implementación pero Claude no dejó commits publicables"
          exit 1
      - name: Crear la rama de implementación (nunca forzada)
        id: push
        if: steps.verify.outputs.verdict == 'PUBLISH' || steps.verify.outputs.verdict == 'PUBLISH_INCOMPLETE'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.verify.outputs.head }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "$HEAD_SHA:refs/heads/$IMPL_BRANCH"


  live_status:
    needs: gate
    if: >-
      ${{ needs.gate.result == 'success' &&
      needs.gate.outputs.ok == 'true' &&
      github.actor == 'joaquinriesco-alt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 245
    permissions:
      actions: read
      issues: write
    env:
      TASK_ID: ${{ needs.gate.outputs.task_id }}
      ISSUE: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Estado vivo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          marker='<!-- escalimetro-auto-task:status -->'
          started=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          comment_id=""
          update() {
            state="$1"; stage="$2"; gate="$3"; agent="$4"; verify="$5"; publish="$6"
            now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            body=$(cat <<EOF
          $marker
          **$TASK_ID — $state**

          Etapa actual: **$stage**
          Inicio: `$started` · Última actualización: `$now`

          $gate TASK validada
          $agent Agente
          $verify Verificación
          $publish Publicación
          ○ Auditoría ChatGPT

          Run: $RUN_URL
          EOF
            )
            if [ -z "$comment_id" ]; then
              comment_id=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
            fi
            if [ -z "$comment_id" ]; then
              comment_id=$(gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="$body" --jq .id)
            else
              gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body" >/dev/null
            fi
          }
          update "ESPERANDO" "preparando runner" "✅" "○" "○" "○"
          while true; do
            jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")
            cs=$(printf '%s' "$jobs" | jq -r '.jobs[] | select(.name=="claude") | .status // empty')
            cc=$(printf '%s' "$jobs" | jq -r '.jobs[] | select(.name=="claude") | .conclusion // empty')
            ps=$(printf '%s' "$jobs" | jq -r '.jobs[] | select(.name=="publish") | .status // empty')
            pc=$(printf '%s' "$jobs" | jq -r '.jobs[] | select(.name=="publish") | .conclusion // empty')
            if [ "$cs" = "in_progress" ]; then
              update "TRABAJANDO" "Claude ejecutando la TASK" "✅" "🔵" "○" "○"
            elif [ "$ps" = "in_progress" ]; then
              update "VERIFICANDO" "verificando y publicando artifact" "✅" "✅" "🔵" "○"
            elif [ "$ps" = "completed" ]; then
              if [ "$pc" = "success" ]; then
                update "TERMINÓ" "automatización terminada" "✅" "✅" "✅" "✅"
              else
                update "FALLÓ" "verificación/publicación falló" "✅" "✅" "❌" "❌"
              fi
              break
            elif [ "$cs" = "completed" ] && [ "$cc" != "success" ]; then
              update "FALLÓ" "agente falló" "✅" "❌" "○" "○"
              break
            else
              update "ESPERANDO" "esperando agente" "✅" "○" "○" "○"
            fi
            sleep 60
          done

  notify:
    needs: [gate, claude, publish]
    # Avisa siempre que el issue pasó la compuerta, también si se canceló. Sólo puede comentar.
    if: >-
      ${{ always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.ok == 'true' &&
      github.actor == 'joaquinriesco-alt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      TASK_ID: ${{ needs.gate.outputs.task_id }}
      IMPL_BRANCH: ${{ needs.gate.outputs.impl_branch }}
      ISSUE: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLAUDE_RESULT: ${{ needs.claude.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      VERDICT: ${{ needs.publish.outputs.verdict }}
      REPORT_OK: ${{ needs.publish.outputs.report }}
      PUSHED: ${{ needs.publish.outputs.pushed }}
    steps:
      - name: Informar estado final en el issue
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ needs.publish.outputs.commits }}
          FILES: ${{ needs.publish.outputs.files }}
        run: |
          marker='<!-- escalimetro-auto-task:status -->'
          {
            echo "$marker"
            if [ "$PUBLISH_RESULT" = "success" ] && [ "$PUSHED" = "success" ]; then ESTADO="TERMINÓ"; else ESTADO="FALLÓ"; fi
            echo "**${TASK_ID} — ${ESTADO}**"
            echo
            echo "Claude: \`${CLAUDE_RESULT}\` · verificación: \`${VERDICT:-SIN_VEREDICTO}\` · publicación: \`${PUBLISH_RESULT}\`"
            echo "Commits: \`${COMMITS:-0}\` · archivos: \`${FILES:-0}\` · REPORT: \`${REPORT_OK:-false}\`"
            echo
            if [ "$PUSHED" = "success" ]; then
              echo "Rama: https://github.com/${REPO}/tree/${IMPL_BRANCH} · REPORT: ${REPORT_OK}"
            elif [ "$VERDICT" = "PUBLISH" ] || [ "$VERDICT" = "PUBLISH_INCOMPLETE" ]; then
              echo "Rama: NO PUBLICADA (push: \`${PUSHED:-sin correr}\`)"
            fi
            echo "Run: ${RUN_URL}"
            echo
            echo "Sin merge, sin deploy. Audita ChatGPT; decide Joaquín."
          } > "$RUNNER_TEMP/comentario.md"
          cid=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$(cat "$RUNNER_TEMP/comentario.md")" >/dev/null 2>&1 || \
              gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/comentario.md"
          else
            gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/comentario.md"
          fi
