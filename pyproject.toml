[project]
name = "escalimetro"
version = "0.1.0"
description = "ETAPA 1 — Normalización: JPG/PDF de planta de oficina → Floorplate JSON → Planta Escalímetro (SVG)"
requires-python = ">=3.10"
dependencies = [
  # --- geometría y visión (E01–E07) ---------------------------------------------------------------
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "shapely>=2.0",
  "scipy>=1.11",
  "pymupdf>=1.24",
  "pytesseract>=0.3",
  # --- solver y render (E04–E07) ------------------------------------------------------------------
  "ortools>=9.9",
  "matplotlib>=3.8",
  "cairosvg>=2.7",
  # --- contratos y capa de IA (E08–E09) -----------------------------------------------------------
  "jsonschema>=4",
  "openai>=1.30",
  "anthropic>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gemini = ["google-genai>=1.0"]       # adaptador opcional, import diferido
sam = ["torch", "sam2"]              # segmentación opcional, import diferido

[project.scripts]
escalimetro = "escalimetro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: llama a APIs reales; sólo corre con API keys presentes y bajo petición explícita",
]
